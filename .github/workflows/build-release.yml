name: Build Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build Package
        run: ./gradlew shadowJar
      - name: Rename JAR
        run: cp build/libs/playit-minecraft-plugin-*.jar build/libs/playit-minecraft-plugin.jar
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/playit-minecraft-plugin.jar
