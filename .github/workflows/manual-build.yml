name: Manual Build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build Package
        run: ./gradlew shadowJar
      - name: Rename JAR
        run: cp build/libs/playit-minecraft-plugin-*.jar build/libs/playit-minecraft-plugin.jar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: playit-minecraft-plugin.jar
          path: build/libs/playit-minecraft-plugin.jar
